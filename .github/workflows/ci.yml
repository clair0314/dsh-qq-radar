name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Python tests (mock OneBot + mock LLM, no network)
        env:
          PYTHONPYCACHEPREFIX: /tmp/qqdigest-pyc
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/test_e2e.py

      - name: Plugin entry parses
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node --check lib/index.js

      - name: Bundle manifest is present
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1)"
